<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cipher AI Pro – Log In</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f4f6f9;
      color: #1a1a2e;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Nav ── */
    nav {
      background: #232f3e;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    nav .logo-text {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.3px;
    }
    nav .logo-text span { color: #5ba4d4; }

    /* ── Main ── */
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 48px 20px;
    }

    /* ── Login card ── */
    .login-card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.09);
      padding: 40px 40px;
      width: 100%;
      max-width: 420px;
    }

    .card-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .card-header h1 {
      font-size: 26px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 8px;
    }
    .card-header p {
      font-size: 14px;
      color: #666;
      line-height: 1.5;
    }

    /* ── Form ── */
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #333;
      margin-bottom: 6px;
    }
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      color: #1a1a2e;
      background: #fafafa;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }
    input[type="email"]:focus,
    input[type="password"]:focus {
      border-color: #007185;
      box-shadow: 0 0 0 3px rgba(0,113,133,0.12);
      background: #fff;
    }
    input::placeholder { color: #bbb; }

    .forgot-row {
      display: flex;
      justify-content: flex-end;
      margin-top: -10px;
      margin-bottom: 24px;
    }
    .forgot-link {
      font-size: 12px;
      color: #007185;
      text-decoration: none;
    }
    .forgot-link:hover { text-decoration: underline; }

    /* ── Status ── */
    .status-msg {
      display: none;
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 16px;
      text-align: center;
    }
    .status-msg.error   { background: #fde8e8; color: #c0392b; border: 1px solid #f5c6cb; }
    .status-msg.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }

    /* ── Buttons ── */
    .btn-login {
      display: block;
      width: 100%;
      padding: 14px;
      background: #232f3e;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.3px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 14px;
    }
    .btn-login:hover  { background: #1a252f; }
    .btn-login:active { background: #131b22; }
    .btn-login:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: #ccc;
      font-size: 12px;
    }
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      border-top: 1px solid #eee;
    }

    .btn-paddle-portal {
      display: block;
      width: 100%;
      padding: 12px;
      background: transparent;
      color: #555;
      font-size: 14px;
      font-weight: 500;
      border: 1px solid #ddd;
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
      text-align: center;
      text-decoration: none;
      margin-bottom: 24px;
    }
    .btn-paddle-portal:hover {
      border-color: #007185;
      color: #007185;
    }

    .divider-line {
      border: none;
      border-top: 1px solid #eee;
      margin: 20px 0;
    }

    .signup-prompt {
      text-align: center;
      font-size: 14px;
      color: #666;
    }
    .signup-prompt a {
      color: #007185;
      text-decoration: none;
      font-weight: 600;
    }
    .signup-prompt a:hover { text-decoration: underline; }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 24px;
      font-size: 12px;
      color: #aaa;
    }
    footer a { color: #888; text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <nav>
    <div class="logo-text">Cipher<span> AI</span></div>
  </nav>

  <main>
    <div class="login-card">

      <div class="card-header">
        <h1>Welcome back</h1>
        <p>Log in to your Cipher AI Pro account to restore unlimited access.</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>

        <div class="forgot-row">
          <a href="YOUR_FORGOT_PASSWORD_URL" class="forgot-link">Forgot password?</a>
        </div>

        <div class="status-msg" id="statusMsg"></div>

        <button type="submit" class="btn-login" id="loginBtn">Log In</button>
      </form>

      <div class="divider">or</div>

      <!-- Paddle customer portal — lets subscribers manage their subscription directly -->
      <a href="YOUR_PADDLE_CUSTOMER_PORTAL_URL" class="btn-paddle-portal" target="_blank" rel="noopener">
        🔗 Manage subscription via Paddle
      </a>

      <hr class="divider-line">
      <p class="signup-prompt">Don't have an account? <a href="./signup.html">Sign up for Pro</a></p>

    </div>
  </main>

  <footer>
    <p>&copy; 2026 Cipher AI &nbsp;·&nbsp; <a href="#">Privacy Policy</a> &nbsp;·&nbsp; <a href="#">Terms of Service</a></p>
  </footer>

  <script>
    // ── API configuration ───────────────────────────────────────────────────
    // Replace with your backend authentication endpoint.
    const LOGIN_API_URL = 'YOUR_BACKEND_API_URL/auth/login'; // e.g. 'https://api.cipher-ai.io/auth/login'
    // ────────────────────────────────────────────────────────────────────────

    const form      = document.getElementById('loginForm');
    const loginBtn  = document.getElementById('loginBtn');
    const statusMsg = document.getElementById('statusMsg');

    function showStatus(message, type) {
      statusMsg.textContent = message;
      statusMsg.className = 'status-msg ' + type;
      statusMsg.style.display = 'block';
    }

    function hideStatus() {
      statusMsg.style.display = 'none';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideStatus();

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showStatus('Please enter your email and password.', 'error');
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = 'Logging in…';

      try {
        const response = await fetch(LOGIN_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });

        const data = await response.json();

        if (response.ok && data.success) {
          // Store auth token for the extension to read
          // Adjust the key/storage mechanism to match your backend's auth flow.
          localStorage.setItem('cipher_ai_auth_token', data.token);
          localStorage.setItem('cipher_ai_pro_status', 'active');
          localStorage.setItem('cipher_ai_has_account', 'true');

          showStatus('Logged in successfully! You can close this tab and reload the extension.', 'success');
          loginBtn.textContent = 'Logged in ✓';

        } else {
          showStatus(data.message || 'Invalid email or password.', 'error');
          loginBtn.disabled = false;
          loginBtn.textContent = 'Log In';
        }

      } catch (err) {
        console.error('Login error:', err);
        showStatus('Could not connect to the server. Please try again.', 'error');
        loginBtn.disabled = false;
        loginBtn.textContent = 'Log In';
      }
    });
  </script>

</body>
</html>
